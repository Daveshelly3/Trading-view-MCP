[project]
name = "tradingview-mcp-server"
version = "0.1.0"
description = "Community MCP server exposing TradingView-style market data, technical indicators, screening and backtesting over public (no-auth) market data."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "daveshelly3" }]
keywords = ["mcp", "tradingview", "trading", "finance", "indicators", "backtesting"]
dependencies = [
    "mcp>=1.2.0",
    "yfinance>=0.2.40",
    "pandas>=2.0",
    "numpy>=1.24",
]

[project.scripts]
tradingview-mcp = "tradingview_mcp.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]
web = ["fastapi>=0.110", "uvicorn>=0.29"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tradingview_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
